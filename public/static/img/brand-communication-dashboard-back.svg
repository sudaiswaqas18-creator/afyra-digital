<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">Afyra Digital Creative Communication Workflow</title>
  <desc id="desc">Detailed Afyra workflow visual with strategy, assets, publishing and authority connected in one system.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#00443E"/><stop offset="1" stop-color="#0E6B61"/></linearGradient>
    <linearGradient id="card2" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF9F7"/></linearGradient>
    <linearGradient id="accent2" x1="0" x2="1"><stop stop-color="#00BBA0"/><stop offset="1" stop-color="#68DBCD"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#001B18" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="1280" height="780" rx="38" fill="url(#bg2)"/>
  <circle cx="1090" cy="112" r="240" fill="#00BBA0" opacity="0.07"/>
  <circle cx="196" cy="676" r="260" fill="#FF960D" opacity="0.06"/>
  <rect x="40" y="40" width="1200" height="700" rx="34" fill="#F8FCFB" filter="url(#shadow2)"/>
  <rect x="40" y="40" width="1200" height="90" rx="34" fill="#FFFFFF"/>
  <line x1="40" y1="130" x2="1240" y2="130" stroke="#DDEBE8"/>
  <image href="/static/img/logo-wide.png" x="74" y="61" width="134" height="44" preserveAspectRatio="xMinYMid meet"/>
  <image href="/static/img/logo-mark.png" x="1147" y="56" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="1164" cy="73" r="22" fill="#DFF6F2" opacity="0.76"/>
  <image href="/static/img/logo-mark.png" x="56" y="350" width="30" height="30" preserveAspectRatio="xMidYMid meet" opacity="0.9"/>
  <image href="/static/img/logo-mark.png" x="1190" y="350" width="30" height="30" preserveAspectRatio="xMidYMid meet" opacity="0.9"/>
  <text x="998" y="87" font-family="Arial" font-size="12" letter-spacing="2" fill="#63857F">SYSTEM 02</text>

  <text x="90" y="186" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2" fill="#668883">CREATIVE COMMUNICATION FLOW</text>
  <text x="90" y="234" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#00443E">Strategy → Content → Assets → Authority</text>
  <text x="90" y="268" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#688A85">A connected Afyra communication workflow aligns message, design and publishing inside one system.</text>

  <g transform="translate(90 324)">
    <rect width="242" height="234" rx="24" fill="url(#card2)" stroke="#DDEBE8"/>
    <circle cx="42" cy="44" r="19" fill="#E5FAF6"/>
    <text x="35" y="51" font-family="Arial" font-size="16" font-weight="700" fill="#008A7A">01</text>
    <text x="28" y="95" font-family="Arial" font-size="23" font-weight="700" fill="#00443E">Strategy</text>
    <text x="28" y="126" font-family="Arial" font-size="13" fill="#688A85">Start with communication goals,</text>
    <text x="28" y="145" font-family="Arial" font-size="13" fill="#688A85">brand positioning and audience clarity.</text>
    <rect x="28" y="181" width="184" height="8" rx="4" fill="#E6F3F1"/>
    <rect x="28" y="181" width="136" height="8" rx="4" fill="#00BBA0"/>
    <text x="28" y="210" font-family="Arial" font-size="11" font-weight="700" fill="#4E817A">POSITIONING · TRUST · EDUCATION</text>
  </g>

  <g transform="translate(366 324)">
    <rect width="242" height="234" rx="24" fill="#FFFFFF" stroke="#DDEBE8"/>
    <circle cx="42" cy="44" r="19" fill="#FFF3E1"/>
    <text x="35" y="51" font-family="Arial" font-size="16" font-weight="700" fill="#C57200">02</text>
    <text x="28" y="95" font-family="Arial" font-size="23" font-weight="700" fill="#00443E">Content</text>
    <text x="28" y="126" font-family="Arial" font-size="13" fill="#688A85">Turn the strategy into structured</text>
    <text x="28" y="145" font-family="Arial" font-size="13" fill="#688A85">educational content and clear messaging.</text>
    <rect x="28" y="181" width="184" height="8" rx="4" fill="#E6F3F1"/>
    <rect x="28" y="181" width="149" height="8" rx="4" fill="#FF960D"/>
    <text x="28" y="210" font-family="Arial" font-size="11" font-weight="700" fill="#8C744D">SCRIPTS · CAPTIONS · CONTENT FLOW</text>
  </g>

  <g transform="translate(642 324)">
    <rect width="242" height="234" rx="24" fill="#FFFFFF" stroke="#DDEBE8"/>
    <circle cx="42" cy="44" r="19" fill="#EDF9F7"/>
    <text x="35" y="51" font-family="Arial" font-size="16" font-weight="700" fill="#0B6F64">03</text>
    <text x="28" y="95" font-family="Arial" font-size="23" font-weight="700" fill="#00443E">Assets</text>
    <text x="28" y="126" font-family="Arial" font-size="13" fill="#688A85">Build visuals, short-form video and</text>
    <text x="28" y="145" font-family="Arial" font-size="13" fill="#688A85">reusable creative assets from the system.</text>
    <rect x="28" y="181" width="184" height="8" rx="4" fill="#E6F3F1"/>
    <rect x="28" y="181" width="132" height="8" rx="4" fill="#00BBA0"/>
    <text x="28" y="210" font-family="Arial" font-size="11" font-weight="700" fill="#4E817A">VIDEO · GRAPHICS · CREATIVE KITS</text>
  </g>

  <g transform="translate(918 324)">
    <rect width="242" height="234" rx="24" fill="#00443E"/>
    <circle cx="42" cy="44" r="19" fill="#0C756A"/>
    <text x="35" y="51" font-family="Arial" font-size="16" font-weight="700" fill="#A9F0E6">04</text>
    <text x="28" y="95" font-family="Arial" font-size="23" font-weight="700" fill="#FFFFFF">Authority</text>
    <text x="28" y="126" font-family="Arial" font-size="13" fill="#C8E5E1">Publish consistently so the brand</text>
    <text x="28" y="145" font-family="Arial" font-size="13" fill="#C8E5E1">feels clear, credible and established.</text>
    <rect x="28" y="181" width="184" height="8" rx="4" fill="#1F615A"/>
    <rect x="28" y="181" width="164" height="8" rx="4" fill="url(#accent2)"/>
    <text x="28" y="210" font-family="Arial" font-size="11" font-weight="700" fill="#A9EFE7">CONSISTENCY · TRUST · PUBLISHING</text>
  </g>

  <g transform="translate(90 610)">
    <rect width="1070" height="68" rx="22" fill="#F2F8F7" stroke="#DDEBE8"/>
    <circle cx="34" cy="34" r="11" fill="#00BBA0"/>
    <text x="56" y="30" font-family="Arial" font-size="12" font-weight="700" fill="#00443E">ONE MANAGED COMMUNICATION SYSTEM</text>
    <text x="56" y="49" font-family="Arial" font-size="11" fill="#678984">Strategy, content, creative and publishing aligned around visibility, trust and authority.</text>
    <rect x="878" y="20" width="160" height="28" rx="14" fill="#DFF8F3"/>
    <text x="915" y="38" font-family="Arial" font-size="11" font-weight="700" fill="#007D6E">AFYRA CONNECTED</text>
  </g>
</svg>
